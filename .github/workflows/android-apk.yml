name: Build ScratchBetter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build independent block editor for Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare app files
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html app.css app.js site/
          touch site/.nojekyll
          test -s site/index.html
          test -s site/app.js
          test -s site/app.css

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor tooling
        run: npm install --no-save --no-audit --no-fund @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7

      - name: Generate Android wrapper
        run: |
          npx cap add android
          npx cap sync android

      - name: Force landscape orientation on Android
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          if not path.exists():
              raise SystemExit("AndroidManifest.xml not found after Capacitor setup.")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          android = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(path)
          root = tree.getroot()
          activities = [item for item in root.findall(".//activity") if "MainActivity" in item.get(android + "name", "")]
          if not activities:
              raise SystemExit("Capacitor MainActivity was not found in AndroidManifest.xml.")
          for activity in activities:
              activity.set(android + "screenOrientation", "sensorLandscape")
          ET.indent(tree, space="    ")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("MainActivity locked to landscape.")
          PY

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScratchBetter-landscape-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
