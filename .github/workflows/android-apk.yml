name: Build ScratchBetter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Scratch Editor for Android (landscape)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout ScratchBetter
        uses: actions/checkout@v4

      - name: Checkout open-source Scratch editor
        uses: actions/checkout@v4
        with:
          repository: scratchfoundation/scratch-editor
          ref: 0207c22d62b654cc3a28300b633c66fabf1de4d4
          path: engine

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install Scratch editor dependencies
        working-directory: engine
        run: npm ci --no-audit --no-fund

      - name: Build Scratch editor
        working-directory: engine
        run: npm run build

      - name: Put the real Scratch editor on the app home screen
        shell: bash
        run: |
          set -euo pipefail
          test -f engine/packages/scratch-gui/build/index.html
          mkdir -p site
          # Put editor files at the web root so /static/... assets resolve correctly.
          cp -a engine/packages/scratch-gui/build/. site/
          cp editor-home.js site/editor-home.js
          cp engine/LICENSE site/LICENSE-SCRATCH-EDITOR.txt
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("site/index.html")
          html = path.read_text(encoding="utf-8")
          html = re.sub(r"<title>.*?</title>", "<title>ScratchBetter</title>", html, count=1, flags=re.I | re.S)
          viewport = '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">'
          if re.search(r'<meta\s+name=["\']viewport["\']', html, flags=re.I):
              html = re.sub(r'<meta\s+name=["\']viewport["\'][^>]*>', viewport, html, count=1, flags=re.I)
          else:
              html = re.sub(r"</head>", f"  {viewport}\n</head>", html, count=1, flags=re.I)
          if "./editor-home.js" not in html:
              html = re.sub(r"</body>", '  <script src="./editor-home.js"></script>\n</body>', html, count=1, flags=re.I)
          if "./editor-home.js" not in html:
              raise SystemExit("Could not add ScratchBetter mobile help script to editor.")
          path.write_text(html, encoding="utf-8")
          PY
          cat > site/UPSTREAM-SOURCE.md <<'EOF'
          ScratchBetter embeds the open-source Scratch Editor.
          Upstream: https://github.com/scratchfoundation/scratch-editor
          Source commit: 0207c22d62b654cc3a28300b633c66fabf1de4d4
          License: AGPL-3.0-only. See LICENSE-SCRATCH-EDITOR.txt.
          ScratchBetter is an independent project and is not endorsed by Scratch Foundation or MIT.
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor tooling
        run: npm install --no-save --no-audit --no-fund @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7

      - name: Generate Android wrapper
        run: |
          npx cap add android
          npx cap sync android

      - name: Force landscape orientation on Android
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          if not path.exists():
              raise SystemExit("AndroidManifest.xml not found after Capacitor setup.")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          android = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(path)
          root = tree.getroot()
          activities = [
              item for item in root.findall(".//activity")
              if "MainActivity" in item.get(android + "name", "")
          ]
          if not activities:
              raise SystemExit("Capacitor MainActivity was not found in AndroidManifest.xml.")
          for activity in activities:
              activity.set(android + "screenOrientation", "sensorLandscape")
          ET.indent(tree, space="    ")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("MainActivity locked to landscape.")
          PY

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScratchBetter-landscape-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
